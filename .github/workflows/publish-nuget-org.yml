name: Publish NuGet Packages to NuGet.org

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (např. beta1, preview2). Ponechej prázdné pro release.'
        required: false
        default: ''

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify NuGet package manifest
        run: bash eng/verify-nuget-package-manifest.sh

      # Načteme základní verzi z csproj a nastavíme finální verzi
      - name: Set version
        id: version
        run: |
          # Načteme verzi z Tempo.Blazor.csproj
          BASE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Tempo.Blazor/Tempo.Blazor.csproj)
          echo "Base version from csproj: $BASE_VERSION"
          
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Z tagu v1.2.3 uděláme verzi 1.2.3
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.version_suffix }}" ]; then
            # Ruční spuštění bez suffixu = použijeme verzi z csproj
            echo "VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "Using release version from csproj: $BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            # Suffix pro prerelease verze (např. 1.0.0-beta1)
            echo "VERSION=$BASE_VERSION-${{ github.event.inputs.version_suffix }}" >> $GITHUB_OUTPUT
            echo "Using version with suffix: $BASE_VERSION-${{ github.event.inputs.version_suffix }}"
          else
            # Pro main/master push použijeme timestamp jako prerelease
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            echo "VERSION=$BASE_VERSION-ci-$TIMESTAMP" >> $GITHUB_OUTPUT
            echo "Using CI version: $BASE_VERSION-ci-$TIMESTAMP"
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      # E2E testy (Playwright), smtp4dev integrační testy a MsSql testy report serveru
      # na CI vynecháváme - runner nemá prohlížeče, běžící demo hosty, smtp4dev kontejner
      # ani SQL Server, takže by spadly na prostředí (NullReferenceException /
      # Connection refused / SqlException error 26), nikoli na logiku.
      # MsSql testy (Tempo.ReportServer.Api.Tests.MsSql.*) potřebují buď
      # localhost\SQLEXPRESS, nebo connection string v env REPORTSERVER_TEST_CONNECTION
      # (viz MsSqlTestDatabase.cs) - lokálně se spouštět MAJÍ a spouštějí.
      # Vzor je ZAKOTVENÝ na jmenný prostor, ne holý substring: jinak by z CI tiše
      # zmizel každý budoucí test se slovem MsSql v názvu, ať leží kdekoli.
      # POZOR: je to obcházka chybějící infrastruktury, ne řešení. Jakmile bude v CI
      # SQL service container nebo REPORTSERVER_TEST_CONNECTION, filtr zase zužte.
      # Drženo v SYNCU s publish-nuget.yml - dva různé filtry = jedno CI trvale
      # červené a tím pádem přestane být čtené jako signál.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Tempo.Blazor.E2E&FullyQualifiedName!~Smtp4Dev&FullyQualifiedName!~Tempo.ReportServer.Api.Tests.MsSql"

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Publikujeme jen na verzovaném tagu (release, refs/tags/v*) nebo při ručním spuštění -
    # NE na každý push do main/master (ten jen builduje a testuje). Verzi řídí tag / csproj.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write  # Povinné pro Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify NuGet package manifest
        run: bash eng/verify-nuget-package-manifest.sh

      # Načteme základní verzi z csproj a nastavíme finální verzi
      - name: Set version
        id: version
        run: |
          # Načteme verzi z Tempo.Blazor.csproj
          BASE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Tempo.Blazor/Tempo.Blazor.csproj)
          echo "Base version from csproj: $BASE_VERSION"
          
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Z tagu v1.2.3 uděláme verzi 1.2.3
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.version_suffix }}" ]; then
            # Ruční spuštění bez suffixu = použijeme verzi z csproj
            echo "VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "Using release version from csproj: $BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            # Suffix pro prerelease verze (např. 1.0.0-beta1)
            echo "VERSION=$BASE_VERSION-${{ github.event.inputs.version_suffix }}" >> $GITHUB_OUTPUT
            echo "Using version with suffix: $BASE_VERSION-${{ github.event.inputs.version_suffix }}"
          fi
          # Tato publish úloha běží jen na tagu refs/tags/v* (release) nebo workflow_dispatch
          # (viz job `if:`), takže větev s CI timestampem (main/master push) z build-and-test zde
          # není dosažitelná a záměrně chybí.

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash eng/pack-nuget-packages.sh

      - name: List packages
        run: ls -la ./packages

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push packages to NuGet.org
        run: |
          for pkg in ./packages/*.nupkg; do
            echo "Publishing $pkg to NuGet.org..."
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
