name: Report Server container smoke

# Heavy job (builds two .NET images, boots SQL Server + Keycloak) — gated:
#   * manual (workflow_dispatch),
#   * a nightly schedule,
#   * pushes/PRs that touch the container artifacts or the report-server hosts.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly 03:00 UTC
  push:
    branches: [ main, plan2-report-server ]
    paths:
      - "deploy/docker/**"
      - "deploy/keycloak/**"
      - "src/Tempo.ReportServer.Api/**"
      - "src/Tempo.ReportServer.Web/**"
      - "src/Tempo.ReportServer.Web.Client/**"
      - "src/Tempo.Reporting.Engine/**"
      - "src/Tempo.Reporting.Abstractions/**"
      - ".github/workflows/report-server-container-smoke.yml"
  pull_request:
    paths:
      - "deploy/docker/**"
      - "deploy/keycloak/**"
      - ".github/workflows/report-server-container-smoke.yml"

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env (non-production test secrets)
        run: |
          cat > .env <<'EOF'
          MSSQL_SA_PASSWORD=Ci_Smoke_Passw0rd!
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=ci-admin
          TEMPO_REPORT_WEB_SECRET=ci-web-secret
          TEMPO_REPORT_M2M_SECRET=ci-m2m-secret
          EOF

      - name: Show compose config (validates YAML + interpolation)
        run: docker compose config >/dev/null

      - name: Build API + Web images
        run: docker compose build api web

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for API /health = Healthy
        run: |
          echo "Waiting for API health on http://localhost:8081/health ..."
          for i in $(seq 1 60); do
            body="$(curl -fsS http://localhost:8081/health 2>/dev/null || true)"
            if echo "$body" | grep -qi "Healthy"; then
              echo "API healthy after ${i} attempts: $body"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API did not become healthy in time"
          exit 1

      - name: Wait for Web root = 200
        run: |
          echo "Waiting for Web root on http://localhost:5000/ ..."
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ || true)"
            if [ "$code" = "200" ]; then
              echo "Web root returned 200 after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web root did not return 200 in time (last: ${code:-none})"
          exit 1

      - name: Assert Keycloak realm imported (OIDC discovery = 200)
        run: |
          url="http://localhost:8080/realms/tempo-reports/.well-known/openid-configuration"
          echo "Checking $url ..."
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "Keycloak realm 'tempo-reports' is served (200)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Keycloak realm discovery did not return 200 (last: ${code:-none})"
          exit 1

      - name: Assert protected API endpoint rejects anonymous (401)
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8081/api/folders?tenantId=t1' || true)"
          echo "Anonymous /api/folders -> $code"
          test "$code" = "401"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down (always)
        if: always()
        run: docker compose down -v --remove-orphans
