<!DOCTYPE html>
<!--
  Phase R — core-engine Playwright harness.
  Loads the bundled document-editor modules (IIFE global `tmDocumentEditorModules`)
  and exposes a render root + readiness flag. The Playwright E2E test drives the
  render host via page.evaluate against `window.tmDocumentEditorModules`.

  Served by the WASM demo at: https://localhost:7106/core-engine-harness.html
  The bundle is the RCL static asset: _content/Tempo.Blazor/js/document-editor.dist.js
  (rebuild with `npm run build:document-editor` after changing any .mjs module).
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>core-engine harness</title>
    <style>
        html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f1f3f5; }
        #harness-root { position: relative; }
        .tm-render-page { background: #fff; margin: 16px auto; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    </style>
</head>
<body>
    <div id="harness-root" data-testid="core-engine-harness-root"></div>
    <script src="_content/Tempo.Blazor/js/document-editor.dist.js"></script>
    <script>
        // Expose a tiny readiness probe + module handle for the Playwright test.
        (function () {
            var modules = window.tmDocumentEditorModules || null;
            window.__coreEngineHarness = {
                ready: !!(modules && modules.coreEngine && typeof modules.coreEngine.createRenderHost === 'function'),
                version: modules && modules.default ? modules.default.version : null,
                modules: modules,
            };
        })();
    </script>
</body>
</html>
