<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>canvas document engine harness</title>
    <style>
        :root {
            --tm-color-surface-muted: #eef1f5;
            --tm-color-surface: #ffffff;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--tm-color-surface-muted);
            color: #111827;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #harness-root {
            min-height: 100vh;
            display: grid;
            align-items: start;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <main id="harness-root" data-testid="document-canvas-engine-host"></main>
    <script type="module">
        import { createCanvasDocumentEngine } from './_content/Tempo.Blazor/js/document-editor-canvas/entry.mjs';

        const root = document.getElementById('harness-root');
        const query = new URLSearchParams(window.location.search);
        const seedId = query.get('seedId') || 'phase-1-empty-a4';
        const engine = createCanvasDocumentEngine({
            host: root,
            document,
            ariaLabel: 'Canvas document engine harness',
            model: {
                documentId: seedId,
                version: 1,
                body: { blocks: [] },
            },
            pageSettings: {
                width: 794,
                height: 1123,
                marginTop: 72,
                marginRight: 72,
                marginBottom: 72,
                marginLeft: 72,
            },
        });

        const result = engine.render();
        window.__canvasDocumentEngineHarness = {
            ready: true,
            seedId,
            engine,
            result,
        };
    </script>
</body>
</html>
